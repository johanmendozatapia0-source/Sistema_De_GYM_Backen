spring.application.name=GYM_FIT

# PostgreSQL. Define DB_URL, DB_USERNAME y DB_PASSWORD en el entorno antes de iniciar.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gymfit_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
server.port=${SERVER_PORT:8080}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
